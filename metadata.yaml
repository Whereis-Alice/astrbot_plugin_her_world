name: astrbot_plugin_her_world
display_name: 她的世界 HW
desc: >-
  给 Bot 一个私有空间和自己的节奏：她有地图、动作、日程、情绪与场景记忆，
  会自己走动、做饭、发呆、翻旧账，也会主动找你说话；你装过的插件工具可以一键挂成"她会的手艺"。
  本仓库是 astrbot_plugin_virtual_world 的二次开发版：改名隔离、批量导入工具、工具集隔离与其它插件联动都做了加强。
