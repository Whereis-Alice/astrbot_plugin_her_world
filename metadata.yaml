help: |
  她的世界 HW：给 Bot 一份私有空间、一套生活节奏，再加上一把随时能用的工具。

  指令前缀是 hw，同时保留别名「她的世界」和 herworld（写哪个都一样）。
  下面示例按 AstrBot 出厂唤醒前缀 / 书写；如果你把唤醒前缀改成了 ! # . 之类，
  请把 /hw 换成 !hw、#hw；如果清空了唤醒前缀，就直接私聊或 @机器人 后写 hw xxx。

  常用指令：
  - /hw status：她现在在哪、在做什么、心情与各项数值
  - /hw memory：看看她记得你什么
  - /hw recall <话题>：让她回忆某个话题
  - /hw schedule：查看全部日程
  - /hw session add：把当前会话加进白名单
  - /hw help：完整指令表

  编辑器（AstrBot 面板 → 插件 → 她的世界 HW → 她的世界编辑器）：
  控制台、事件、通讯录、记忆库、日志、调试、地图、动作库、日程、会话、全局设置、预设。
  动作库里的「从工具导入…」支持一次把 AstrBot 的工具挂成她的动作：
  可以只勾几个，也可以全选；名字、说明、分组、参数提示都会自动带好，之后照常手改。
